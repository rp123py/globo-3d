 const points=[...micro.map(m=>({...m,kind:'micro'})),...capPoints,...cityPoints];
 G.pointsData(points).pointLat(d=>d.lat).pointLng(d=>d.lng).pointAltitude(d=>d.kind==='micro'?.034:d.kind==='capital'?.03:.022).pointRadius(d=>d.kind==='micro'?.045:d.kind==='capital'?.026:Math.max(.005,Math.min(.020,Math.sqrt(Math.max(1,d.pop))*0.000005))).pointColor(d=>d.kind==='micro'?'rgba(255,210,35,.98)':d.kind==='capital'?'rgba(255,231,100,.98)':'rgba(110,195,255,.90)').pointsMerge(true).onPointClick(d=>{if(d.kind==='micro'){openInfo(d.pt,d.capital,[]);G.pointOfView({lat:d.lat,lng:d.lng,altitude:.45},750)}else if(d.kind==='city'){G.pointOfView({lat:d.lat,lng:d.lng,altitude:.48},650);document.getElementById('status').textContent='Cidade: '+d.name}else{G.pointOfView({lat:d.lat,lng:d.lng,altitude:.65},650)}});
 const controls=G.controls();controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=105;controls.maxDistance=500;controls.rotateSpeed=.42;controls.zoomSpeed=.72;controls.enablePan=false;
 function update(){let alt=G.pointOfView().altitude;G.pointColor(d=>d.kind==='micro'?'rgba(255,210,35,.98)':d.kind==='capital'?(alt<2.6?'rgba(255,231,100,.98)':'rgba(255,231,100,.0)'):(showCities&&alt<1.42?'rgba(110,195,255,.90)':'rgba(110,195,255,0)'));G.labelColor(d=>d.kind==='country'?(showNames&&alt<2.75?'rgba(255,255,255,.86)':'rgba(255,255,255,0)'):d.kind==='micro'?'rgba(255,215,40,.98)':d.kind==='capital'?(alt<2.15?'rgba(255,230,100,.98)':'rgba(255,230,100,0)'):'rgba(255,255,255,0)')}
 controls.addEventListener('change',update);update();
 function openCountry(f){let raw=f.properties?.NAME,name=nameOf(f),cap=capitals[raw]||capitals[f.properties?.ADMIN]||'Capital não identificada';let list=cities.filter(c=>{const p=c.properties||{};const n=String(p.adm0name||p.NAME||p.country||'').toLowerCase();return n===String(raw||'').toLowerCase()||n===String(admin||'').toLowerCase()||n===String(f.properties?.NAME_LONG||'').toLowerCase();}).sort((a,b)=>(+b.properties.pop_max||0)-(+a.properties.pop_max||0));openInfo(name,cap,list)}
 document.getElementById('close').onclick=()=>document.getElementById('info').style.display='none';document.getElementById('home').onclick=()=>G.pointOfView({lat:20,lng:0,altitude:2.35},900);document.getElementById('zin').onclick=()=>{let p=G.pointOfView();G.pointOfView({...p,altitude:Math.max(.32,p.altitude*.76)},420)};document.getElementById('zout').onclick=()=>{let p=G.pointOfView();G.pointOfView({...p,altitude:Math.min(5,p.altitude*1.28)},420)};document.getElementById('rot').onclick=()=>{rotating=!rotating;controls.autoRotate=rotating;controls.autoRotateSpeed=.5;document.getElementById('rot').textContent=rotating?'⏸ Parar':'▶ Rodar'};document.getElementById('cityBtn').onclick=()=>{showCities=!showCities;document.getElementById('cityBtn').textContent=showCities?'🏙️ Cidades':'🚫 Cidades';update()};document.getElementById('nameBtn').onclick=()=>{showNames=!showNames;document.getElementById('nameBtn').textContent=showNames?'🏳️ Países':'🚫 Países';update()};
 document.getElementById('search').addEventListener('keydown',e=>{if(e.key!=='Enter')return;let q=e.target.value.trim().toLowerCase();if(!q)return;let f=countries.find(x=>nameOf(x).toLowerCase().includes(q)||String(x.properties?.NAME||'').toLowerCase().includes(q)||String(x.properties?.ADMIN||'').toLowerCase().includes(q)||String(x.properties?.NAME_LONG||'').toLowerCase().includes(q));if(f){selected=f;openCountry(f);let c=centroid(f);G.pointOfView({lat:c[1],lng:c[0],altitude:1.55},850);return}let m=micro.find(x=>x.pt.toLowerCase().includes(q)||x.name.toLowerCase().includes(q));if(m){openInfo(m.pt,m.capital,[]);G.pointOfView({lat:m.lat,lng:m.lng,altitude:.45},750);return}let c=cityPoints.find(x=>x.name.toLowerCase().includes(q));if(c)G.pointOfView({lat:c.lat,lng:c.lng,altitude:.45},750)});
 addEventListener('resize',()=>G.width(innerWidth).height(innerHeight));document.getElementById('loading').style.display='none';document.getElementById('status').textContent='196 países • '+cities.length+' cidades • otimizado';G.pointOfView({lat:20,lng:0,altitude:2.35},0)
}
main();
</script>
